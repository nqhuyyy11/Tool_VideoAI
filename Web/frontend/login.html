<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - AutoVideo</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=5">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body class="auth-page" data-page="login">
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="loader" aria-hidden="true"><div class="loader-title">AutoVideo</div><div class="loader-bar"><i></i></div></div>
  
  <main class="auth-wrap stack">
    <div class="stack-sm">
      <h1>AutoVideo</h1>
      <p class="muted">Tạo video ngắn tự động bằng AI.</p>
    </div>

    <form id="auth-form" class="card stack">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tab-login" aria-selected="true">Đăng nhập</button>
        <button type="button" class="tab" role="tab" id="tab-signup" aria-selected="false">Đăng ký</button>
      </div>

      <label>Email
        <input type="email" id="email" autocomplete="email" required>
      </label>
      <label>Mật khẩu
        <input type="password" id="password" autocomplete="current-password" minlength="6" required>
      </label>
      <label id="confirm-wrap" hidden>Nhập lại mật khẩu
        <input type="password" id="confirm" autocomplete="new-password" minlength="6">
      </label>

      <p id="page-error" class="error-text" role="alert" hidden></p>
      <p id="notice" class="small" role="status" hidden></p>

      <button type="submit" id="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/common.js?v=2"></script>
  <script src="/js/login.js?v=2"></script>
  <script type="module" src="/js/world.js?v=2"></script>
</body>
</html>
